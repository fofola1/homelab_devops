name: "Setup Environment and deploy process"

on:
  workflow_dispatch:
    inputs:

      TS_OAUTH_CLIENT_ID:
        description: 'Tailscale OAuth Client ID'
        required: true
        type: string
      TS_OAUTH_SECRET:
        description: 'Tailscale OAuth Secret'
        required: true
        type: string

      TS_PROXMOX_HOSTNAME:
        description: 'Proxmox Hostname'
        required: true
        type: string
      PROXMOX_NODE:
        description: 'Proxmox Node'
        required: true
        type: string
      PVE_API_TOKEN_ID:
        description: 'Proxmox API Token ID'
        required: true
        type: string
      PVE_API_TOKEN_SECRET:
        description: 'Proxmox API Token Secret'
        required: true
        type: string
      PROXMOX_SSH_KEY:
        description: 'Proxmox SSH Key'
        required: true
        type: string
      PROXMOX_KNOWN_HOSTS:
        description: 'Proxmox Known Hosts'
        required: true
        type: string

      DOCKER_VM_ANSIBLE_TARGET_GROUP:
        description: 'Docker VM Ansible Target Group'
        required: true
        default: 'docker_hosts'
        type: string

      DOCKER_VM_HOST_IP:
        description: 'Docker VM Host IP'
        required: true
        type: string
      DOCKER_VM_TEMPLATE_ID:
        description: 'Docker VM Template ID'
        required: true
        type: string
      DOCKER_VM_ID:
        description: 'Docker VM ID'
        required: true
        type: string
      DOCKER_VM_DATASTORE:
        description: 'Docker VM Datastore'
        required: true
        type: string
      DOCKER_VM_IPV4_CIDR:
        description: 'Docker VM IPv4 CIDR'
        required: true
        default: '24'
        type: string
      DOCKER_VM_IPV4_GATEWAY:
        description: 'Docker VM IPv4 Gateway'
        required: true
        type: string
      DOCKER_VM_NETWORK_BRIDGE:
        description: 'Docker VM Network Bridge'
        required: true
        default: 'vmbr0'
        type: string
      DOCKER_VM_DEPLOY_PATH:
        description: 'Deployment Path'
        required: true
        default: '/opt/docker'
        type: string
      DOCKER_VM_DEPLOY_USER:
        description: 'Deployment User'
        required: true
        default: 'deploy'
        type: string
      DOCKER_VM_KNOWN_HOSTS:
        description: 'Docker VM Known Hosts'
        required: true
        type: string

permissions:
  actions: write

jobs:
  process-input:
    runs-on: ubuntu-latest
    steps:
      - name: "Set Environment Variables"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_PROXMOX_HOSTNAME: ${{ inputs.TS_PROXMOX_HOSTNAME }}
          PROXMOX_NODE: ${{ inputs.PROXMOX_NODE }}
          DOCKER_VM_ANSIBLE_TARGET_GROUP: ${{ inputs.DOCKER_VM_ANSIBLE_TARGET_GROUP }}
          DOCKER_VM_HOST_IP: ${{ inputs.DOCKER_VM_HOST_IP }}
          DOCKER_VM_TEMPLATE_ID: ${{ inputs.DOCKER_VM_TEMPLATE_ID }}
          DOCKER_VM_ID: ${{ inputs.DOCKER_VM_ID }}
          DOCKER_VM_DATASTORE: ${{ inputs.DOCKER_VM_DATASTORE }}
          DOCKER_VM_IPV4_CIDR: ${{ inputs.DOCKER_VM_IPV4_CIDR }}
          DOCKER_VM_IPV4_GATEWAY: ${{ inputs.DOCKER_VM_IPV4_GATEWAY }}
          DOCKER_VM_NETWORK_BRIDGE: ${{ inputs.DOCKER_VM_NETWORK_BRIDGE }}
          DOCKER_VM_DEPLOY_PATH: ${{ inputs.DOCKER_VM_DEPLOY_PATH }}
          DOCKER_VM_DEPLOY_USER: ${{ inputs.DOCKER_VM_DEPLOY_USER }}
        run: |
          set -euo pipefail
          vars=(
            "TS_PROXMOX_HOSTNAME"
            "PROXMOX_NODE"
            "DOCKER_VM_ANSIBLE_TARGET_GROUP"
            "DOCKER_VM_HOST_IP"
            "DOCKER_VM_TEMPLATE_ID"
            "DOCKER_VM_ID"
            "DOCKER_VM_DATASTORE"
            "DOCKER_VM_IPV4_CIDR"
            "DOCKER_VM_IPV4_GATEWAY"
            "DOCKER_VM_NETWORK_BRIDGE"
            "DOCKER_VM_DEPLOY_PATH"
            "DOCKER_VM_DEPLOY_USER"
          )
          for var in "${vars[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: Input variable '$var' is not set. Exiting workflow."
              exit 1
            fi
          done

          for var in "${vars[@]}"; do
            echo "Setting $var"
            gh variable set "$var" --body "${!var}" --repo "$GITHUB_REPOSITORY"
          done
      - name: "Set Secrets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ inputs.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ inputs.TS_OAUTH_SECRET }}
          PVE_API_TOKEN_ID: ${{ inputs.PVE_API_TOKEN_ID }}
          PVE_API_TOKEN_SECRET: ${{ inputs.PVE_API_TOKEN_SECRET }}
          PROXMOX_SSH_KEY: ${{ inputs.PROXMOX_SSH_KEY }}
          PROXMOX_KNOWN_HOSTS: ${{ inputs.PROXMOX_KNOWN_HOSTS }}
          DOCKER_VM_HOST_IP: ${{ inputs.DOCKER_VM_HOST_IP }}
          DOCKER_VM_KNOWN_HOSTS: ${{ inputs.DOCKER_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          secrs=(
            "TS_OAUTH_CLIENT_ID"
            "TS_OAUTH_SECRET"
            "PVE_API_TOKEN_ID"
            "PVE_API_TOKEN_SECRET"
            "PROXMOX_SSH_KEY"
            "PROXMOX_KNOWN_HOSTS"
            "DOCKER_VM_HOST_IP"
            "DOCKER_VM_KNOWN_HOSTS"
          )
          for secr in "${secrs[@]}"; do
            if [[ -z "${!secr}" ]]; then
              echo "Error: Input secret '$secr' is not set. Exiting workflow."
              exit 1
            fi
          done

          for secr in "${secrs[@]}"; do
            echo "Setting $secr"
            gh secret set "$secr" --app actions --body "${!secr}" --repo "$GITHUB_REPOSITORY"
            gh secret list --app actions --repo "$GITHUB_REPOSITORY" | awk '{print tolower($1)}' | grep -Fx "$(printf '%s' "$secr" | tr '[:upper:]' '[:lower:]')" >/dev/null
          done