name: "CI - Validate"

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    lint-terraform:
        name: "Terraform Lint & Validate"
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Setup Terraform"
                uses: hashicorp/setup-terraform@v4.0.1
            -
                name: "Validate formatting & syntax"
                run: |
                    set -euo pipefail
                    test -d terraform
                    cd terraform
                    terraform fmt -check
                    terraform init -backend=false
                    terraform validate

    lint-ansible:
        name: "Ansible Lint"
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Setup Python"
                uses: actions/setup-python@v7
                with:
                    python-version: "3.12"
                    cache: "pip"
            -
                name: "Install and run ansible-lint"
                run: |
                    set -euo pipefail
                    test -d ansible
                    python -m pip install ansible-lint==25.6.1
                    ansible-lint ansible/

    lint-docker:
        name: "Docker Compose Validation"
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Validate Compose Files"
                run: |
                    set -euo pipefail
                    test -d docker
                    compose_files=$(find docker -type f \( -name "docker-compose*.yml" -o -name "compose.yml" \) -print)
                    test -n "${compose_files}"
                    while read -r compose_file; do
                        echo "Checking $compose_file..."
                        docker compose -f "$compose_file" config --quiet
                    done <<< "${compose_files}"

    lint-scripts:
        name: "ShellCheck"
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Run ShellCheck"
                run: |
                    set -euo pipefail
                    test -d scripts
                    scripts=$(find scripts/ -type f -name "*.sh" -print)
                    test -n "${scripts}"
                    while read -r script; do
                        echo "Checking $script..."
                        shellcheck "$script"
                    done <<< "${scripts}"
