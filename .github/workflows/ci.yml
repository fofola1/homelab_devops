name: "CI - Validate"

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    lint-terraform:
        name: "Terraform Lint & Validate"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${TERRAFORM_VERSION}"
                  echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: ${{ steps.versions.outputs.terraform_version }}
            - name: "Validate formatting & syntax"
              run: |
                  set -euo pipefail
                  test -d terraform
                  cd terraform
                  terraform fmt -check -recursive
                  terraform init -backend=false
                  terraform validate

    lint-ansible:
        name: "Ansible Lint"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${PYTHON_VERSION}"
                  echo "python_version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Python"
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ steps.versions.outputs.python_version }}
            - name: "Install and run ansible-lint"
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -d ansible
                  python -m pip install "ansible-lint==${ANSIBLE_LINT_VERSION}"
                  ansible-lint ansible/

    lint-docker:
        name: "Docker Compose Validation"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Validate Compose Files"
              run: |
                  set -euo pipefail
                  test -d docker
                  compose_files=$(find docker -type f \( -name "docker-compose*.yml" -o -name "compose.yml" \) -print)
                  test -n "${compose_files}"
                  while read -r compose_file; do
                      echo "Checking $compose_file..."
                      docker compose -f "$compose_file" config --quiet
                  done <<< "${compose_files}"

    lint-scripts:
        name: "ShellCheck"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Run ShellCheck"
              run: |
                  set -euo pipefail
                  test -d scripts
                  mapfile -t scripts < <(
                      find . -maxdepth 1 -type f -name "*.sh" -print
                      find scripts/ -type f -name "*.sh" -print
                  )
                  test "${#scripts[@]}" -gt 0
                  bash scripts/validate-layout.sh
                  for script in "${scripts[@]}"; do
                      echo "Checking $script..."
                      shellcheck "$script"
                  done
