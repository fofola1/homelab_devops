name: "CD - Deploy to Proxmox"

on:
    workflow_dispatch:
    push:
        branches: [main]

concurrency:
    group: "cd-production"
    cancel-in-progress: false

jobs:
    detect-changes:
        name: "Detect Changes"
        runs-on: ubuntu-latest
        outputs:
            terraform: ${{ steps.filter.outputs.terraform }}
            ansible: ${{ steps.filter.outputs.ansible }}
            docker: ${{ steps.filter.outputs.docker }}
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Check modified paths"
                uses: dorny/paths-filter@v4.0.3
                id: filter
                with:
                    filters: |
                        terraform:
                            - 'terraform/**'
                        ansible:
                            - 'ansible/**'
                        docker:
                            - 'docker/**'

    terraform-plan:
        name: "0. Terraform Plan"
        needs: detect-changes
        if: needs.detect-changes.outputs.terraform == 'true'
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Connect to Tailscale"
                uses: tailscale/github-action@v4.1.3
                with:
                    oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                    oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                    tags: tag:proxmox-ci
            -
                name: "Setup Terraform"
                uses: hashicorp/setup-terraform@v4.0.1
            -
                name: "Terraform Init & Plan"
                env:
                    PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/api2/json
                    PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                    PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                run: |
                    cd terraform
                    terraform init
                    terraform plan -out=tfplan
            -
                name: "Upload Terraform Plan"
                uses: actions/upload-artifact@v7.0.1
                with:
                    name: terraform-plan
                    path: terraform/tfplan
                    retention-days: 7

    terraform-apply:
        name: "1. Terraform Apply"
        needs: [detect-changes, terraform-plan]
        environment: prod
        if: needs.detect-changes.outputs.terraform == 'true'
        runs-on: ubuntu-latest
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v7.0.1
            -
                name: "Connect to Tailscale"
                uses: tailscale/github-action@v4.1.3
                with:
                    oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                    oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                    tags: tag:proxmox-ci
            -
                name: "Setup Terraform"
                uses: hashicorp/setup-terraform@v4.0.1
            -
                name: "Download Terraform Plan"
                uses: actions/download-artifact@v8.0.1
                with:
                    name: terraform-plan
                    path: terraform
            -
                name: "Terraform Init & Apply"
                env:
                    PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/api2/json
                    PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                    PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                run: |
                    cd terraform
                    terraform init
                    terraform apply -auto-approve tfplan