name: "CD - Deploy to Proxmox"

on:
    workflow_dispatch:
        inputs:
            force_deploy:
                description: "Deploy all components"
                required: true
                default: false
                type: boolean
    push:
        branches: [main]

concurrency:
    group: "cd-production"
    cancel-in-progress: false

jobs:
    detect-changes:
        name: "Detect Changes"
        timeout-minutes: 10
        runs-on: ubuntu-latest
        outputs:
            terraform: ${{ steps.filter.outputs.terraform }}
            ansible: ${{ steps.filter.outputs.ansible }}
            docker: ${{ steps.filter.outputs.docker }}
            force_deploy: ${{ inputs.force_deploy }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Check modified paths"
              uses: dorny/paths-filter@v4.0.3
              id: filter
              with:
                  filters: |
                      terraform:
                          - 'terraform/**'
                          - 'report-proxmox-state.conf'
                          - '.github/versions.env'
                          - 'prepare-proxmox.sh'
                          - 'prepare-proxmox-remote.sh'
                          - 'scripts/proxmox-known-hosts.sh'
                          - 'scripts/report-proxmox-state.sh'
                          - 'scripts/terraform-state.sh'
                      ansible:
                          - 'ansible/**'
                      docker:
                          - 'docker/**'

    terraform-plan:
        name: "0. Terraform Plan"
        timeout-minutes: 30
        needs: detect-changes
        if: needs.detect-changes.outputs.terraform == 'true' || needs.detect-changes.outputs.force_deploy == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Restore Terraform state"
              run: bash scripts/terraform-state.sh restore
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.1.3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${TERRAFORM_VERSION}"
                  echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: ${{ steps.versions.outputs.terraform_version }}
            - name: "Prepare VM SSH key"
              id: ssh-key
              env:
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
              run: |
                  set -euo pipefail
                  test -n "${PROXMOX_SSH_KEY}"
                  public_key=$(ssh-keygen -y -f <(printf '%s\n' "${PROXMOX_SSH_KEY}"))
                  test -n "${public_key}"
                  echo "public_key=${public_key}" >> "$GITHUB_OUTPUT"
            - name: "Upload Debian image to Proxmox"
              env:
                  PROXMOX_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/api2/json
                  PROXMOX_API_TOKEN: ${{ secrets.PVE_API_TOKEN }}
                  PROXMOX_NODE: ${{ vars.PROXMOX_NODE }}
                  IMAGE_DATASTORE: ${{ vars.DOCKER_VM_IMAGE_DATASTORE }}
                  IMAGE_URL: https://cloud.debian.org/images/cloud/bookworm/20261026-2643/debian-12-genericcloud-amd64-20261026-2643.qcow2
                  IMAGE_FILE_NAME: debian-12-genericcloud-amd64.qcow2
                  IMAGE_SHA512: 0464b5d4ae3aa4f658468d88da83af7857b71548b30d46dcb6282770955a747fb95a983476db90d25afd0653af607224c7ebd05122ab71faa106fd712aaad652
              run: |
                  set -euo pipefail
                  image_path="${RUNNER_TEMP}/${IMAGE_FILE_NAME}"
                  curl --fail --location --retry 5 --output "${image_path}" "${IMAGE_URL}"
                  printf '%s  %s\n' "${IMAGE_SHA512}" "${image_path}" | sha512sum --check --status
                  auth_header="Authorization: PVEAPIToken=${PROXMOX_API_TOKEN}"
                  content_url="${PROXMOX_API_URL}/nodes/${PROXMOX_NODE}/storage/${IMAGE_DATASTORE}/content?content=import"
                  content_response=$(mktemp)
                  trap 'rm -f "${content_response}"' EXIT
                  curl --insecure --fail-with-body --silent --show-error --header "${auth_header}" \
                      "${content_url}" > "${content_response}"
                  if ! jq -e --arg volume "${IMAGE_DATASTORE}:import/${IMAGE_FILE_NAME}" \
                      '.data[] | select(.volid == $volume)' "${content_response}" >/dev/null; then
                      curl --insecure --fail-with-body --silent --show-error --header "${auth_header}" \
                          --form "content=import" \
                          --form "filename=@${image_path}" \
                          "${PROXMOX_API_URL}/nodes/${PROXMOX_NODE}/storage/${IMAGE_DATASTORE}/upload"
                  fi
            - name: "Terraform Init & Plan"
              env:
                  PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_api_url: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  TF_VAR_proxmox_api_token: ${{ secrets.PVE_API_TOKEN_ID }}=${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_node: ${{ vars.PROXMOX_NODE }}
                  TF_VAR_vm_id: ${{ vars.DOCKER_VM_ID }}
                  TF_VAR_vm_datastore: ${{ vars.DOCKER_VM_DATASTORE }}
                  TF_VAR_vm_image_datastore: ${{ vars.DOCKER_VM_IMAGE_DATASTORE }}
                  TF_VAR_vm_ipv4_address: ${{ vars.DOCKER_VM_HOST_IP }}
                  TF_VAR_vm_ipv4_cidr: ${{ vars.DOCKER_VM_IPV4_CIDR }}
                  TF_VAR_vm_ipv4_gateway: ${{ vars.DOCKER_VM_IPV4_GATEWAY }}
                  TF_VAR_docker_user: ${{ vars.DOCKER_VM_DEPLOY_USER }}
                  TF_VAR_ssh_public_key: ${{ steps.ssh-key.outputs.public_key }}
              run: |
                  cd terraform
                  terraform init
                  terraform plan -var-file=templates/debian-12.tfvars -out=tfplan

    terraform-apply:
        name: "1. Terraform Apply"
        timeout-minutes: 45
        needs: [detect-changes, terraform-plan]
        environment: prod
        if: needs.detect-changes.outputs.terraform == 'true' || needs.detect-changes.outputs.force_deploy == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Restore Terraform state"
              run: bash scripts/terraform-state.sh restore
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.1.3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${TERRAFORM_VERSION}"
                  echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: ${{ steps.versions.outputs.terraform_version }}
            - name: "Prepare VM SSH key"
              id: ssh-key
              env:
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
              run: |
                  set -euo pipefail
                  test -n "${PROXMOX_SSH_KEY}"
                  public_key=$(ssh-keygen -y -f <(printf '%s\n' "${PROXMOX_SSH_KEY}"))
                  test -n "${public_key}"
                  echo "public_key=${public_key}" >> "$GITHUB_OUTPUT"
            - name: "Ensure Terraform SDN ACL"
              env:
                  PVE_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  test -n "${PVE_API_TOKEN_ID}"
                  test -n "${PROXMOX_SSH_KEY}"
                  test -n "${TS_PROXMOX_HOSTNAME}"
                  api_user="${PVE_API_TOKEN_ID%%!*}"
                  key_file=$(mktemp)
                  known_hosts_file=$(mktemp)
                  trap 'rm -f "${key_file}" "${known_hosts_file}"' EXIT
                  printf '%s\n' "${PROXMOX_SSH_KEY}" > "${key_file}"
                  chmod 600 "${key_file}"
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" "${known_hosts_file}"
                  ssh_options=(-i "${key_file}" -o BatchMode=yes -o ConnectTimeout=15 \
                      -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}")
                  if ! ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::Unable to authenticate to root@${TS_PROXMOX_HOSTNAME} with the PROXMOX_SSH_KEY secret."
                      echo "Install this public key in /root/.ssh/authorized_keys on the Proxmox host:"
                      ssh-keygen -y -f "${key_file}"
                      echo "Then re-run the workflow. Running ./prepare-proxmox.sh configures this automatically."
                      exit 1
                  fi
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                      "pveum acl modify /sdn/zones/localnetwork/vmbr0 -user '${api_user}' -role homelab-terraform"
            - name: "Terraform Init & Apply"
              env:
                  PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_api_url: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  TF_VAR_proxmox_api_token: ${{ secrets.PVE_API_TOKEN_ID }}=${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_node: ${{ vars.PROXMOX_NODE }}
                  TF_VAR_vm_id: ${{ vars.DOCKER_VM_ID }}
                  TF_VAR_vm_datastore: ${{ vars.DOCKER_VM_DATASTORE }}
                  TF_VAR_vm_image_datastore: ${{ vars.DOCKER_VM_IMAGE_DATASTORE }}
                  TF_VAR_vm_ipv4_address: ${{ vars.DOCKER_VM_HOST_IP }}
                  TF_VAR_vm_ipv4_cidr: ${{ vars.DOCKER_VM_IPV4_CIDR }}
                  TF_VAR_vm_ipv4_gateway: ${{ vars.DOCKER_VM_IPV4_GATEWAY }}
                  TF_VAR_docker_user: ${{ vars.DOCKER_VM_DEPLOY_USER }}
                  TF_VAR_ssh_public_key: ${{ steps.ssh-key.outputs.public_key }}
              run: |
                  cd terraform
                  terraform init
                  # Regenerate the plan in this job instead of uploading the plan
                  # file as an artifact: this repository is public and plan files
                  # contain sensitive variable values.
                  terraform plan -var-file=templates/debian-12.tfvars -out=tfplan
                  terraform apply -auto-approve tfplan
            - name: "Save Terraform state"
              if: always()
              run: bash scripts/terraform-state.sh save

    ansible:
        name: "2. Run Ansible"
        timeout-minutes: 90
        needs: [detect-changes, terraform-apply]
        environment: prod
        if: |
            always() &&
            (
                needs.terraform-apply.result == 'success' ||
                (
                    needs.detect-changes.outputs.terraform != 'true' &&
                    needs.detect-changes.outputs.force_deploy != 'true' &&
                    needs.terraform-apply.result == 'skipped'
                )
            ) &&
            (
                needs.detect-changes.outputs.ansible == 'true' ||
                needs.detect-changes.outputs.terraform == 'true' ||
                needs.detect-changes.outputs.force_deploy == 'true'
            )
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.1.3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Setup SSH Agent"
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
            - name: "Run Ansible Playbook"
              env:
                  ANSIBLE_HOST_KEY_CHECKING: "true"
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
                  DOCKER_VM_HOST_IP: ${{ vars.DOCKER_VM_HOST_IP }}
                  DOCKER_VM_DEPLOY_USER: ${{ vars.DOCKER_VM_DEPLOY_USER }}
                  DOCKER_VM_DEPLOY_PATH: ${{ vars.DOCKER_VM_DEPLOY_PATH }}
                  DOCKER_VM_IPV4_GATEWAY: ${{ vars.DOCKER_VM_IPV4_GATEWAY }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  source .github/versions.env
                  export TERRAFORM_VERSION ANSIBLE_VERSION
                  test -s ansible/inventory/proxmox.yml
                  test -f ansible/site.yml
                  test -n "${DOCKER_VM_DEPLOY_PATH}"
                  test -n "${DOCKER_VM_IPV4_GATEWAY}"
                  mkdir -p ~/.ssh
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" ~/.ssh/known_hosts
                  ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
                  if ! ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::SSH to root@${TS_PROXMOX_HOSTNAME} failed. Verify that PROXMOX_SSH_KEY is authorized for root."
                      exit 1
                  fi
                  docker_vm_known_hosts=
                  for _ in $(seq 1 60); do
                      # shellcheck disable=SC2029
                      docker_vm_known_hosts=$(ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                          "ssh-keyscan -T 5 -H '${DOCKER_VM_HOST_IP}' 2>/dev/null" || true)
                      if [[ -n "${docker_vm_known_hosts}" ]]; then
                          printf '%s\n' "${docker_vm_known_hosts}" >> ~/.ssh/known_hosts
                          break
                      fi
                      sleep 5
                  done
                  if [[ -z "${docker_vm_known_hosts}" ]]; then
                      echo "::error::Unable to retrieve SSH host keys for the Docker VM at ${DOCKER_VM_HOST_IP}."
                      exit 1
                  fi
                  python -m pip install "ansible==${ANSIBLE_VERSION}"
                  ansible-inventory -i ansible/inventory/proxmox.yml --graph docker_hosts
                  ansible docker_hosts -i ansible/inventory/proxmox.yml --list-hosts
                  ansible_common_args=(--ssh-common-args="-o ProxyJump=root@${TS_PROXMOX_HOSTNAME}")
                  ansible docker_hosts -i ansible/inventory/proxmox.yml -m wait_for_connection \
                      -a 'timeout=300' "${ansible_common_args[@]}"
                  ansible docker_hosts -i ansible/inventory/proxmox.yml -m command \
                      -a 'cloud-init status --wait' "${ansible_common_args[@]}"
                  ansible-playbook -i ansible/inventory/proxmox.yml --limit docker_hosts \
                      "${ansible_common_args[@]}" ansible/site.yml

    docker:
        name: "3. Deploy Docker Workloads"
        timeout-minutes: 30
        needs: [detect-changes, ansible]
        environment: prod
        if: |
            always() &&
            (
                needs.ansible.result == 'success' ||
                (
                    needs.detect-changes.outputs.ansible != 'true' &&
                    needs.detect-changes.outputs.terraform != 'true' &&
                    needs.detect-changes.outputs.force_deploy != 'true' &&
                    needs.ansible.result == 'skipped'
                )
            ) &&
            (
                needs.detect-changes.outputs.docker == 'true' ||
                needs.detect-changes.outputs.ansible == 'true' ||
                needs.detect-changes.outputs.terraform == 'true' ||
                needs.detect-changes.outputs.force_deploy == 'true'
            )
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.1.3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Setup SSH Agent"
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
            - name: "Deploy Compose Stacks via Remote Host"
              env:
                  DOCKER_VM_HOST_IP: ${{ vars.DOCKER_VM_HOST_IP }}
                  DOCKER_VM_DEPLOY_PATH: ${{ vars.DOCKER_VM_DEPLOY_PATH }}
                  DOCKER_VM_DEPLOY_USER: ${{ vars.DOCKER_VM_DEPLOY_USER }}
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  test -d docker
                  test -n "${DOCKER_VM_DEPLOY_USER}"
                  test -n "${DOCKER_VM_HOST_IP}"
                  test -n "${DOCKER_VM_DEPLOY_PATH}"
                  mkdir -p ~/.ssh
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" ~/.ssh/known_hosts
                  jump_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
                  if ! ssh "${jump_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::SSH to root@${TS_PROXMOX_HOSTNAME} failed. Verify that PROXMOX_SSH_KEY is authorized for root."
                      exit 1
                  fi
                  docker_vm_known_hosts=
                  for _ in $(seq 1 60); do
                      # shellcheck disable=SC2029
                      docker_vm_known_hosts=$(ssh "${jump_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                          "ssh-keyscan -T 5 -H '${DOCKER_VM_HOST_IP}' 2>/dev/null" || true)
                      if [[ -n "${docker_vm_known_hosts}" ]]; then
                          printf '%s\n' "${docker_vm_known_hosts}" >> ~/.ssh/known_hosts
                          break
                      fi
                      sleep 5
                  done
                  if [[ -z "${docker_vm_known_hosts}" ]]; then
                      echo "::error::Unable to retrieve SSH host keys for the Docker VM at ${DOCKER_VM_HOST_IP}."
                      exit 1
                  fi
                  ssh_options=(-o "ProxyJump=root@${TS_PROXMOX_HOSTNAME}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "${DOCKER_VM_DEPLOY_USER}@${DOCKER_VM_HOST_IP}" "mkdir -p '${DOCKER_VM_DEPLOY_PATH}'"
                  rsync -az --delete -e "ssh ${ssh_options[*]}" docker/ "${DOCKER_VM_DEPLOY_USER}@${DOCKER_VM_HOST_IP}:${DOCKER_VM_DEPLOY_PATH}/"
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "${DOCKER_VM_DEPLOY_USER}@${DOCKER_VM_HOST_IP}" \
                  "cd '${DOCKER_VM_DEPLOY_PATH}' && docker compose pull && docker compose up -d --remove-orphans --wait && docker compose ps"
