name: "CD - Deploy to Proxmox"

permissions:
    contents: read

on:
    workflow_dispatch:
        inputs:
            force_deploy:
                description: "Deploy all components"
                required: true
                default: false
                type: boolean
    push:
        branches: [main]

concurrency:
    group: "cd-production"
    cancel-in-progress: false

jobs:
    detect-changes:
        name: "Detect Changes"
        timeout-minutes: 10
        runs-on: ubuntu-latest
        outputs:
            terraform: ${{ steps.filter.outputs.terraform }}
            ansible: ${{ steps.filter.outputs.ansible }}
            docker: ${{ steps.filter.outputs.docker }}
            force_deploy: ${{ inputs.force_deploy }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Check modified paths"
              uses: dorny/paths-filter@v4.0.3
              id: filter
              with:
                  filters: |
                      terraform:
                          - 'terraform/**'
                          - 'config/**'
                          - 'report-proxmox-state.conf'
                          - '.github/versions.env'
                          - 'prepare-proxmox.sh'
                          - 'prepare-proxmox-remote.sh'
                          - 'scripts/proxmox-known-hosts.sh'
                          - 'scripts/report-proxmox-state.sh'
                          - 'scripts/terraform-state.sh'
                      ansible:
                          - 'ansible/**'
                          - 'config/**'
                      docker:
                          - 'docker/**'

    ansible-host:
        name: "1. Run Ansible (Host)"
        timeout-minutes: 90
        needs: [detect-changes]
        if: |
            always() &&
            (
                needs.detect-changes.outputs.ansible == 'true' ||
                needs.detect-changes.outputs.terraform == 'true' ||
                needs.detect-changes.outputs.force_deploy == 'true'
            )
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.4.0
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Setup SSH Agent"
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
            - name: "Run Ansible Playbook"
              env:
                  ANSIBLE_HOST_KEY_CHECKING: "true"
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  source .github/versions.env
                  export TERRAFORM_VERSION ANSIBLE_VERSION
                  test -s ansible/inventory/proxmox.yml
                  test -f ansible/host.yml
                  test -n "${TS_PROXMOX_HOSTNAME}"
                  mkdir -p ~/.ssh
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" ~/.ssh/known_hosts
                  ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
                  if ! ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::SSH to root@${TS_PROXMOX_HOSTNAME} failed."
                      exit 1
                  fi
                  python -m pip install "ansible==${ANSIBLE_VERSION}"
                  ansible-inventory -i ansible/inventory/proxmox.yml --graph proxmox_hosts
                  ansible proxmox_hosts -i ansible/inventory/proxmox.yml --list-hosts
                  ansible_common_args=(--ssh-common-args="-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes")
                  ansible proxmox_hosts -i ansible/inventory/proxmox.yml -m wait_for_connection -a 'timeout=300' "${ansible_common_args[@]}"
                  ansible-playbook -i ansible/inventory/proxmox.yml --limit proxmox_hosts "${ansible_common_args[@]}" ansible/host.yml

    terraform-plan:
        name: "2. Terraform Plan"
        timeout-minutes: 30
        needs: [detect-changes, ansible-host]
        if: needs.detect-changes.outputs.terraform == 'true' || needs.detect-changes.outputs.force_deploy == 'true'
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_S3_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_S3_KEY_SECRET }}
            AWS_ENDPOINT_URL_S3: ${{ vars.TF_STATE_S3_URL }}
            TF_STATE_S3_NAME: ${{ vars.TF_STATE_S3_NAME || 'tfstate' }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Restore Terraform state"
              run: bash scripts/terraform-state.sh restore
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.4.0
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${TERRAFORM_VERSION}"
                  echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: ${{ steps.versions.outputs.terraform_version }}
            - name: "Prepare VM SSH key"
              id: ssh-key
              env:
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
              run: |
                  set -euo pipefail
                  test -n "${PROXMOX_SSH_KEY}"
                  public_key=$(ssh-keygen -y -f <(printf '%s\n' "${PROXMOX_SSH_KEY}"))
                  test -n "${public_key}"
                  echo "public_key=${public_key}" >> "$GITHUB_OUTPUT"
            - name: "Resolve template profile"
              id: template
              run: |
                  set -euo pipefail
                  template_name="$(yq '.cloud_storage.template' config/infra.yaml)"
                  template_name="${template_name:-alpine-324}"
                  template_file="terraform/templates/${template_name}.tfvars"
                  test -f "${template_file}"
                  image_url=$(sed -n 's|^[[:space:]]*image_url[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_file_name=$(sed -n 's|^[[:space:]]*image_file_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_checksum=$(sed -n 's|^[[:space:]]*image_checksum[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_checksum_algorithm=$(sed -n 's|^[[:space:]]*image_checksum_algorithm[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  test -n "${image_url}"
                  test -n "${image_file_name}"
                  test -n "${image_checksum}"
                  test -n "${image_checksum_algorithm}"
                  echo "name=${template_name}" >> "${GITHUB_OUTPUT}"
                  echo "tfvars=templates/${template_name}.tfvars" >> "${GITHUB_OUTPUT}"
                  echo "image_url=${image_url}" >> "${GITHUB_OUTPUT}"
                  echo "image_file_name=${image_file_name}" >> "${GITHUB_OUTPUT}"
                  echo "image_checksum=${image_checksum}" >> "${GITHUB_OUTPUT}"
                  echo "image_checksum_algorithm=${image_checksum_algorithm}" >> "${GITHUB_OUTPUT}"

            - name: "Resolve infrastructure configuration"
              id: infra
              run: |
                  set -euo pipefail
                  echo "proxmox_node=$(yq '.proxmox.node' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_id=$(yq '.cloud_storage.id' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_datastore=$(yq '.cloud_storage.datastore' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_image_datastore=$(yq '.cloud_storage.image_datastore' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_host_ip=$(yq '.cloud_storage.network.ip' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_ipv4_cidr=$(yq '.cloud_storage.network.cidr' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_ipv4_gateway=$(yq '.cloud_storage.network.gateway' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_path=$(yq '.cloud_storage.deploy.path' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_user=$(yq '.cloud_storage.deploy.user' config/infra.yaml)" >> "$GITHUB_OUTPUT"
            - name: "Upload cloud image to Proxmox"
              env:
                  PROXMOX_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/api2/json
                  PROXMOX_API_TOKEN: ${{ secrets.PVE_API_TOKEN }}
                  PROXMOX_NODE: ${{ steps.infra.outputs.proxmox_node }}
                  IMAGE_DATASTORE: ${{ steps.infra.outputs.cloud_storage_image_datastore }}
                  IMAGE_URL: ${{ steps.template.outputs.image_url }}
                  IMAGE_FILE_NAME: ${{ steps.template.outputs.image_file_name }}
                  IMAGE_SHA512: ${{ steps.template.outputs.image_checksum }}
                  IMAGE_CHECKSUM_ALGORITHM: ${{ steps.template.outputs.image_checksum_algorithm }}
              run: |
                  set -euo pipefail
                  image_path="${RUNNER_TEMP}/${IMAGE_FILE_NAME}"
                  curl --fail --location --retry 5 --output "${image_path}" "${IMAGE_URL}"
                  printf '%s  %s\n' "${IMAGE_SHA512}" "${image_path}" | "${IMAGE_CHECKSUM_ALGORITHM}sum" --check --status
                  auth_header="Authorization: PVEAPIToken=${PROXMOX_API_TOKEN}"
                  content_url="${PROXMOX_API_URL}/nodes/${PROXMOX_NODE}/storage/${IMAGE_DATASTORE}/content?content=import"
                  content_response=$(mktemp)
                  trap 'rm -f "${content_response}"' EXIT
                  curl --insecure --fail-with-body --silent --show-error --header "${auth_header}" \
                      "${content_url}" > "${content_response}"
                  if ! jq -e --arg volume "${IMAGE_DATASTORE}:import/${IMAGE_FILE_NAME}" \
                      '.data[] | select(.volid == $volume)' "${content_response}" >/dev/null; then
                      curl --insecure --fail-with-body --silent --show-error --header "${auth_header}" \
                          --form "content=import" \
                          --form "filename=@${image_path}" \
                          "${PROXMOX_API_URL}/nodes/${PROXMOX_NODE}/storage/${IMAGE_DATASTORE}/upload"
                  fi
            - name: "Terraform Init & Plan"
              env:
                  PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_api_url: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  TF_VAR_proxmox_api_token: ${{ secrets.PVE_API_TOKEN_ID }}=${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_ssh_public_key: ${{ steps.ssh-key.outputs.public_key }}
              run: |
                  cd terraform
                  terraform init -backend-config="bucket=${TF_STATE_S3_NAME}" -reconfigure -force-copy
                  terraform plan -var-file="${{ steps.template.outputs.tfvars }}" -out=tfplan

    terraform-apply:
        name: "3. Terraform Apply"
        timeout-minutes: 45
        needs: [detect-changes, terraform-plan]
        environment: prod
        if: needs.detect-changes.outputs.terraform == 'true' || needs.detect-changes.outputs.force_deploy == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_S3_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_S3_KEY_SECRET }}
            AWS_ENDPOINT_URL_S3: ${{ vars.TF_STATE_S3_URL }}
            TF_STATE_S3_NAME: ${{ vars.TF_STATE_S3_NAME || 'tfstate' }}
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Restore Terraform state"
              run: bash scripts/terraform-state.sh restore
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.4.0
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Load tool versions"
              id: versions
              run: |
                  set -euo pipefail
                  source .github/versions.env
                  test -n "${TERRAFORM_VERSION}"
                  echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v4.0.1
              with:
                  terraform_version: ${{ steps.versions.outputs.terraform_version }}
            - name: "Prepare VM SSH key"
              id: ssh-key
              env:
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
              run: |
                  set -euo pipefail
                  test -n "${PROXMOX_SSH_KEY}"
                  public_key=$(ssh-keygen -y -f <(printf '%s\n' "${PROXMOX_SSH_KEY}"))
                  test -n "${public_key}"
                  echo "public_key=${public_key}" >> "$GITHUB_OUTPUT"
            - name: "Ensure Terraform SDN ACL"
              env:
                  PVE_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
                  PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  test -n "${PVE_API_TOKEN_ID}"
                  test -n "${PROXMOX_SSH_KEY}"
                  test -n "${TS_PROXMOX_HOSTNAME}"
                  api_user="${PVE_API_TOKEN_ID%%!*}"
                  key_file=$(mktemp)
                  known_hosts_file=$(mktemp)
                  trap 'rm -f "${key_file}" "${known_hosts_file}"' EXIT
                  printf '%s\n' "${PROXMOX_SSH_KEY}" > "${key_file}"
                  chmod 600 "${key_file}"
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" "${known_hosts_file}"
                  ssh_options=(-i "${key_file}" -o BatchMode=yes -o ConnectTimeout=15 \
                      -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}")
                  if ! ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::Unable to authenticate to root@${TS_PROXMOX_HOSTNAME} with the PROXMOX_SSH_KEY secret."
                      echo "Install this public key in /root/.ssh/authorized_keys on the Proxmox host:"
                      ssh-keygen -y -f "${key_file}"
                      echo "Then re-run the workflow. Running ./prepare-proxmox.sh configures this automatically."
                      exit 1
                  fi
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                      "pveum acl modify /sdn/zones/localnetwork/vmbr0 -user '${api_user}' -role homelab-terraform"
            - name: "Resolve template profile"
              id: template
              run: |
                  set -euo pipefail
                  template_name="$(yq '.cloud_storage.template' config/infra.yaml)"
                  template_name="${template_name:-alpine-324}"
                  template_file="terraform/templates/${template_name}.tfvars"
                  test -f "${template_file}"
                  image_url=$(sed -n 's|^[[:space:]]*image_url[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_file_name=$(sed -n 's|^[[:space:]]*image_file_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_checksum=$(sed -n 's|^[[:space:]]*image_checksum[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  image_checksum_algorithm=$(sed -n 's|^[[:space:]]*image_checksum_algorithm[[:space:]]*=[[:space:]]*"\([^"]*\)".*|\1|p' "${template_file}" | head -n 1)
                  test -n "${image_url}"
                  test -n "${image_file_name}"
                  test -n "${image_checksum}"
                  test -n "${image_checksum_algorithm}"
                  echo "name=${template_name}" >> "${GITHUB_OUTPUT}"
                  echo "tfvars=templates/${template_name}.tfvars" >> "${GITHUB_OUTPUT}"
                  echo "image_url=${image_url}" >> "${GITHUB_OUTPUT}"
                  echo "image_file_name=${image_file_name}" >> "${GITHUB_OUTPUT}"
                  echo "image_checksum=${image_checksum}" >> "${GITHUB_OUTPUT}"
                  echo "image_checksum_algorithm=${image_checksum_algorithm}" >> "${GITHUB_OUTPUT}"
            - name: "Terraform Init & Apply"
              env:
                  PM_API_URL: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  PM_API_TOKEN_ID: ${{ secrets.PVE_API_TOKEN_ID }}
                  PM_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_proxmox_api_url: https://${{ vars.TS_PROXMOX_HOSTNAME }}:8006/
                  TF_VAR_proxmox_api_token: ${{ secrets.PVE_API_TOKEN_ID }}=${{ secrets.PVE_API_TOKEN_SECRET }}
                  TF_VAR_ssh_public_key: ${{ steps.ssh-key.outputs.public_key }}
              run: |
                  cd terraform
                  terraform init -backend-config="bucket=${TF_STATE_S3_NAME}" -reconfigure -force-copy
                  # Regenerate the plan in this job instead of uploading the plan
                  # file as an artifact: this repository is public and plan files
                  # contain sensitive variable values.
                  terraform plan -var-file="${{ steps.template.outputs.tfvars }}" -out=tfplan
                  terraform apply -auto-approve tfplan
            - name: "Save Terraform state"
              if: always()
              env:
                  TERRAFORM_STATE_TO_GIT: ${{ vars.TERRAFORM_STATE_TO_GIT }}
              run: bash scripts/terraform-state.sh save

    ansible:
        name: "4. Run Ansible (Docker)"
        timeout-minutes: 90
        needs: [detect-changes, terraform-apply]
        environment: prod
        if: |
            always() &&
            (
                needs.terraform-apply.result == 'success' ||
                (
                    needs.detect-changes.outputs.terraform != 'true' &&
                    needs.detect-changes.outputs.force_deploy != 'true' &&
                    needs.terraform-apply.result == 'skipped'
                )
            ) &&
            (
                needs.detect-changes.outputs.ansible == 'true' ||
                needs.detect-changes.outputs.terraform == 'true' ||
                needs.detect-changes.outputs.force_deploy == 'true'
            )
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.4.0
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Setup SSH Agent"
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
            - name: "Resolve infrastructure configuration"
              id: infra
              run: |
                  set -euo pipefail
                  echo "cloud_storage_host_ip=$(yq '.cloud_storage.network.ip' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_user=$(yq '.cloud_storage.deploy.user' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_path=$(yq '.cloud_storage.deploy.path' config/infra.yaml)" >> "$GITHUB_OUTPUT"
            - name: "Run Ansible Playbook"
              env:
                  ANSIBLE_HOST_KEY_CHECKING: "true"
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
                  CLOUD_STORAGE_HOST_IP: ${{ steps.infra.outputs.cloud_storage_host_ip }}
                  CLOUD_STORAGE_DEPLOY_USER: ${{ steps.infra.outputs.cloud_storage_deploy_user }}
                  CLOUD_STORAGE_DEPLOY_PATH: ${{ steps.infra.outputs.cloud_storage_deploy_path }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  source .github/versions.env
                  export TERRAFORM_VERSION ANSIBLE_VERSION
                  test -s ansible/inventory/proxmox.yml
                  test -f ansible/site.yml
                  test -n "${CLOUD_STORAGE_DEPLOY_PATH}"
                  mkdir -p ~/.ssh
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" ~/.ssh/known_hosts
                  ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
                  if ! ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::SSH to root@${TS_PROXMOX_HOSTNAME} failed. Verify that PROXMOX_SSH_KEY is authorized for root."
                      exit 1
                  fi
                  cloud_storage_known_hosts=
                  for _ in $(seq 1 60); do
                      # shellcheck disable=SC2029
                      cloud_storage_known_hosts=$(ssh "${ssh_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                          "ssh-keyscan -T 5 -H '${CLOUD_STORAGE_HOST_IP}' 2>/dev/null" || true)
                      if [[ -n "${cloud_storage_known_hosts}" ]]; then
                          printf '%s\n' "${cloud_storage_known_hosts}" >> ~/.ssh/known_hosts
                          break
                      fi
                      sleep 5
                  done
                  if [[ -z "${cloud_storage_known_hosts}" ]]; then
                      echo "::error::Unable to retrieve SSH host keys for the Cloud Storage VM at ${CLOUD_STORAGE_HOST_IP}."
                      exit 1
                  fi
                  python -m pip install "ansible==${ANSIBLE_VERSION}"
                  ansible-inventory -i ansible/inventory/proxmox.yml --graph cloud_storage_hosts
                  ansible cloud_storage_hosts -i ansible/inventory/proxmox.yml --list-hosts
                  ansible_common_args=(--ssh-common-args="-o ProxyJump=root@${TS_PROXMOX_HOSTNAME}")
                  ansible cloud_storage_hosts -i ansible/inventory/proxmox.yml -m wait_for_connection \
                      -a 'timeout=300' "${ansible_common_args[@]}"
                  ansible cloud_storage_hosts -i ansible/inventory/proxmox.yml -m command \
                      -a 'cloud-init status --wait' "${ansible_common_args[@]}"
                  ansible-playbook -i ansible/inventory/proxmox.yml --limit cloud_storage_hosts \
                      "${ansible_common_args[@]}" ansible/site.yml

    docker:
        name: "5. Deploy Docker Workloads"
        timeout-minutes: 30
        needs: [detect-changes, ansible]
        environment: prod
        if: |
            always() &&
            (
                needs.ansible.result == 'success' ||
                (
                    needs.detect-changes.outputs.ansible != 'true' &&
                    needs.detect-changes.outputs.terraform != 'true' &&
                    needs.detect-changes.outputs.force_deploy != 'true' &&
                    needs.ansible.result == 'skipped'
                )
            ) &&
            (
                needs.detect-changes.outputs.docker == 'true' ||
                needs.detect-changes.outputs.ansible == 'true' ||
                needs.detect-changes.outputs.terraform == 'true' ||
                needs.detect-changes.outputs.force_deploy == 'true'
            )
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v7.0.1
            - name: "Connect to Tailscale"
              uses: tailscale/github-action@v4.4.0
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:proxmox-ci
            - name: "Setup SSH Agent"
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.PROXMOX_SSH_KEY }}
            - name: "Resolve infrastructure configuration"
              id: infra
              run: |
                  set -euo pipefail
                  echo "cloud_storage_host_ip=$(yq '.cloud_storage.network.ip' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_path=$(yq '.cloud_storage.deploy.path' config/infra.yaml)" >> "$GITHUB_OUTPUT"
                  echo "cloud_storage_deploy_user=$(yq '.cloud_storage.deploy.user' config/infra.yaml)" >> "$GITHUB_OUTPUT"
            - name: "Deploy Compose Stacks via Remote Host"
              env:
                  CLOUD_STORAGE_HOST_IP: ${{ steps.infra.outputs.cloud_storage_host_ip }}
                  CLOUD_STORAGE_DEPLOY_PATH: ${{ steps.infra.outputs.cloud_storage_deploy_path }}
                  CLOUD_STORAGE_DEPLOY_USER: ${{ steps.infra.outputs.cloud_storage_deploy_user }}
                  TS_PROXMOX_HOSTNAME: ${{ vars.TS_PROXMOX_HOSTNAME }}
                  PROXMOX_KNOWN_HOSTS: ${{ secrets.PROXMOX_KNOWN_HOSTS }}
                  PROXMOX_HOST_KEY_FINGERPRINT: ${{ vars.PROXMOX_HOST_KEY_FINGERPRINT }}
              run: |
                  # shellcheck disable=SC2029
                  set -euo pipefail
                  test -d docker
                  test -n "${CLOUD_STORAGE_DEPLOY_USER}"
                  test -n "${CLOUD_STORAGE_HOST_IP}"
                  test -n "${CLOUD_STORAGE_DEPLOY_PATH}"
                  mkdir -p ~/.ssh
                  bash scripts/proxmox-known-hosts.sh "${TS_PROXMOX_HOSTNAME}" ~/.ssh/known_hosts
                  jump_options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
                  if ! ssh "${jump_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" true; then
                      echo "::error::SSH to root@${TS_PROXMOX_HOSTNAME} failed. Verify that PROXMOX_SSH_KEY is authorized for root."
                      exit 1
                  fi
                  cloud_storage_known_hosts=
                  for _ in $(seq 1 60); do
                      # shellcheck disable=SC2029
                      cloud_storage_known_hosts=$(ssh "${jump_options[@]}" "root@${TS_PROXMOX_HOSTNAME}" \
                          "ssh-keyscan -T 5 -H '${CLOUD_STORAGE_HOST_IP}' 2>/dev/null" || true)
                      if [[ -n "${cloud_storage_known_hosts}" ]]; then
                          printf '%s\n' "${cloud_storage_known_hosts}" >> ~/.ssh/known_hosts
                          break
                      fi
                      sleep 5
                  done
                  if [[ -z "${cloud_storage_known_hosts}" ]]; then
                      echo "::error::Unable to retrieve SSH host keys for the Cloud Storage VM at ${CLOUD_STORAGE_HOST_IP}."
                      exit 1
                  fi
                  ssh_options=(-o "ProxyJump=root@${TS_PROXMOX_HOSTNAME}" -o BatchMode=yes -o StrictHostKeyChecking=yes)
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "${CLOUD_STORAGE_DEPLOY_USER}@${CLOUD_STORAGE_HOST_IP}" "mkdir -p '${CLOUD_STORAGE_DEPLOY_PATH}'"
                  rsync -az --delete -e "ssh ${ssh_options[*]}" docker/ "${CLOUD_STORAGE_DEPLOY_USER}@${CLOUD_STORAGE_HOST_IP}:${CLOUD_STORAGE_DEPLOY_PATH}/"
                  # shellcheck disable=SC2029
                  ssh "${ssh_options[@]}" "${CLOUD_STORAGE_DEPLOY_USER}@${CLOUD_STORAGE_HOST_IP}" \
                  "cd '${CLOUD_STORAGE_DEPLOY_PATH}' && docker compose pull && docker compose up -d --remove-orphans --wait && docker compose ps"
