---
- name: Configure the Proxmox host
  hosts: proxmox_hosts
  become: true
  gather_facts: true

  vars:
    zfs_pool_name: tank
    zfs_pool_drives: "{{ lookup('env', 'ZFS_POOL_DRIVES') | default('', true) | split(',') }}"
    zfs_pool_raid_level: "{{ lookup('env', 'ZFS_POOL_RAID_LEVEL') | default('raidz1', true) }}"

  tasks:
    - name: Verify the ZFS pool configuration
      ansible.builtin.assert:
        that:
          - zfs_pool_drives | length > 0
          - zfs_pool_raid_level | length > 0
        fail_msg: >-
          ZFS_POOL_DRIVES must be set to a comma-separated list of whole disk
          devices for the pool, for example /dev/disk/by-id/scsi-SATA_.... ZFS_POOL_RAID_LEVEL
          defaults to raidz1 when unset.

    - name: Check ZFS pool status
      ansible.builtin.command: zpool status {{ zfs_pool_name }}
      register: zfs_pool_status
      changed_when: false
      failed_when: false

    - name: Create ZFS pool
      ansible.builtin.command: >-
        zpool create -f {{ zfs_pool_name }} {{ zfs_pool_raid_level }} {{ zfs_pool_drives | join(' ') }}
      when: zfs_pool_status.rc != 0
      changed_when: true

- name: Configure the Cloud Storage VM
  hosts: cloud_storage_hosts
  become: true
  gather_facts: true

  vars:
    cloud_storage_deploy_path: "{{ lookup('env', 'CLOUD_STORAGE_DEPLOY_PATH') }}"
    cloud_storage_ipv4_gateway: "{{ lookup('env', 'CLOUD_STORAGE_IPV4_GATEWAY') }}"

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Verify the deployment settings are configured
      ansible.builtin.assert:
        that:
          - cloud_storage_deploy_path | length > 0
          - cloud_storage_ipv4_gateway | length > 0
        fail_msg: "CLOUD_STORAGE_DEPLOY_PATH and CLOUD_STORAGE_IPV4_GATEWAY must be set."

  tasks:
    - name: Inspect the VM network configuration
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - ip -brief address
        - ip route
        - cat /etc/resolv.conf
      register: network_configuration
      changed_when: false
      failed_when: false

    - name: Show the VM network configuration
      ansible.builtin.debug:
        msg: "{{ network_configuration.results | map(attribute='stdout_lines') | list }}"

    - name: Configure DNS resolvers
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver {{ cloud_storage_ipv4_gateway }}
          nameserver 1.1.1.1

    - name: Verify DNS resolution
      ansible.builtin.command:
        cmd: timeout 15 getent ahostsv4 dl-cdn.alpinelinux.org
      register: dns_resolution
      changed_when: false
      retries: 3
      delay: 2
      until: dns_resolution.rc == 0

    - name: Install base packages
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - python3
          - rsync
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.package:
        name:
          - docker
          - docker-cli-compose
        state: present
        update_cache: true

    - name: Enable the Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the deployment user to the Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Refresh the connection so the Docker group is applied
      ansible.builtin.meta: reset_connection

    - name: Verify the deployment user is in the Docker group
      ansible.builtin.command: id -nG {{ ansible_user }}
      register: deployment_user_groups
      changed_when: false
      failed_when: "'docker' not in deployment_user_groups.stdout.split()"

    - name: Create the Docker deployment directory
      ansible.builtin.file:
        path: "{{ cloud_storage_deploy_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Ensure the virtiofs kernel module is loaded
      ansible.builtin.command:
        cmd: modprobe virtiofs
      changed_when: false

    - name: Load the virtiofs kernel module at boot
      ansible.builtin.copy:
        dest: /etc/modules
        mode: "0644"
        content: virtiofs

    - name: Create the shared storage mount points
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /tank/immich
        - /tank/filebrowser

    - name: Mount the Immich storage share over virtiofs
      ansible.posix.mount:
        path: /tank/immich
        src: immich
        fstype: virtiofs
        state: mounted

    - name: Mount the FileBrowser storage share over virtiofs
      ansible.posix.mount:
        path: /tank/filebrowser
        src: filebrowser
        fstype: virtiofs
        state: mounted

    - name: Verify Docker installation
      ansible.builtin.command: docker version
      changed_when: false

    - name: Verify Docker Compose installation
      ansible.builtin.command: docker compose version
      changed_when: false
