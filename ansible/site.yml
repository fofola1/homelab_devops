---
- name: Configure the Cloud Storage VM
  hosts: cloud_storage_hosts
  become: true
  gather_facts: true

  vars_files:
    - ../config/infra.yaml

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Report cloud-init errors
      ansible.builtin.command: cloud-init status --long
      changed_when: false
      failed_when: false
      register: cloud_init_status

    - name: Show cloud-init status
      ansible.builtin.debug:
        var: cloud_init_status.stdout_lines
      when: cloud_init_status.stdout | length > 0

    - name: Verify the deployment settings are configured
      ansible.builtin.assert:
        that:
          - cloud_storage.deploy.path | length > 0
          - cloud_storage.network.gateway | length > 0
          - access.admin_user | length > 0
          - access.deploy_user | length > 0
          - query('fileglob', playbook_dir + '/../' + access.admin_authorized_keys_dir + '/*.pub') | length > 0
        fail_msg: >-
          The deployment path, network gateway, access users, and at least one
          administrator public key must be configured in config/infra.yaml and
          config/ssh/admin/.

  tasks:
    - name: Inspect the VM network configuration
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - ip -brief address
        - ip route
        - cat /etc/resolv.conf
      register: network_configuration
      changed_when: false
      failed_when: false

    - name: Show the VM network configuration
      ansible.builtin.debug:
        msg: "{{ network_configuration.results | map(attribute='stdout_lines') | list }}"

    - name: Configure DNS resolvers
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver {{ cloud_storage.network.gateway }}
          nameserver 1.1.1.1

    - name: Verify DNS resolution
      ansible.builtin.command:
        cmd: timeout 15 getent ahostsv4 dl-cdn.alpinelinux.org
      register: dns_resolution
      changed_when: false
      retries: 3
      delay: 2
      until: dns_resolution.rc == 0

    - name: Install base packages
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - python3
          - rsync
          - sudo
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.package:
        name:
          - docker
          - docker-cli-compose
        state: present
        update_cache: true

    - name: Enable the Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the administrator user
      ansible.builtin.user:
        name: "{{ access.admin_user }}"
        groups: wheel
        append: true
        create_home: true
        shell: /bin/ash
        state: present

    - name: Collect the administrator authorized keys
      ansible.builtin.set_fact:
        admin_authorized_keys: "{{ admin_authorized_keys | default([]) + [lookup('file', item)] }}"
      loop: "{{ query('fileglob', playbook_dir + '/../' + access.admin_authorized_keys_dir + '/*.pub') }}"

    - name: Install the administrator authorized keys
      ansible.posix.authorized_key:
        user: "{{ access.admin_user }}"
        exclusive: true
        key: "{{ admin_authorized_keys | join('\n') }}"

    - name: Allow the administrator user to use sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admin
        mode: "0440"
        content: "{{ access.admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Check for the image default user
      ansible.builtin.command: id alpine
      register: alpine_user
      changed_when: false
      failed_when: false

    - name: Lock the image default user
      ansible.builtin.user:
        name: alpine
        password_lock: true
      when: alpine_user.rc == 0

    - name: Remove the image default user SSH keys
      ansible.builtin.file:
        path: /home/alpine/.ssh/authorized_keys
        state: absent
      when: alpine_user.rc == 0

    - name: Allow the deployment user to use sudo for provisioning
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        mode: "0440"
        content: "{{ access.deploy_user }} ALL=(ALL) NOPASSWD: ALL\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Add the deployment user to the Docker group
      ansible.builtin.user:
        name: "{{ access.deploy_user }}"
        groups: docker
        append: true

    - name: Refresh the connection so the Docker group is applied
      ansible.builtin.meta: reset_connection

    - name: Verify the deployment user is in the Docker group
      ansible.builtin.command: id -nG {{ access.deploy_user }}
      register: deployment_user_groups
      changed_when: false
      failed_when: "'docker' not in deployment_user_groups.stdout.split()"

    - name: Create the Docker deployment directory
      ansible.builtin.file:
        path: "{{ cloud_storage.deploy.path }}"
        state: directory
        owner: "{{ access.deploy_user }}"
        group: "{{ access.deploy_user }}"
        mode: "0755"

    - name: Ensure the virtiofs kernel module is loaded
      ansible.builtin.command:
        cmd: modprobe virtiofs
      changed_when: false
      when: cloud_storage.storage.virtiofs_shares | default(false)

    - name: Load the virtiofs kernel module at boot
      ansible.builtin.copy:
        dest: /etc/modules
        mode: "0644"
        content: virtiofs
      when: cloud_storage.storage.virtiofs_shares | default(false)

    - name: Create the shared storage mount points
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /tank/immich
        - /tank/filebrowser

    - name: Mount the Immich storage share over virtiofs
      ansible.posix.mount:
        path: /tank/immich
        src: immich
        fstype: virtiofs
        state: mounted
      when: cloud_storage.storage.virtiofs_shares | default(false)

    - name: Mount the FileBrowser storage share over virtiofs
      ansible.posix.mount:
        path: /tank/filebrowser
        src: filebrowser
        fstype: virtiofs
        state: mounted
      when: cloud_storage.storage.virtiofs_shares | default(false)

    - name: Create the SSH configuration directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure SSH access
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-onprem.conf
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          AllowUsers {{ access.admin_user }} {{ access.deploy_user }}
      notify: Reload sshd

    - name: Ensure the SSH include directory is enabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertbefore: BOF
      notify: Reload sshd

    - name: Validate the SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Set the root console password
      ansible.builtin.user:
        name: root
        password: "{{ lookup('env', 'CLOUD_STORAGE_ROOT_PASSWORD_HASH') }}"
      when: lookup('env', 'CLOUD_STORAGE_ROOT_PASSWORD_HASH') | length > 0

    - name: Verify Docker installation
      ansible.builtin.command: docker version
      changed_when: false

    - name: Verify Docker Compose installation
      ansible.builtin.command: docker compose version
      changed_when: false

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded
