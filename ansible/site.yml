---
- name: Configure the Docker VM
  hosts: docker_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Install host dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - python3
          - python3-pip
          - unzip
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add deployment user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Install Terraform
      ansible.builtin.unarchive:
        src: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/terraform
      vars:
        terraform_version: "{{ lookup('env', 'TERRAFORM_VERSION') }}"

    - name: Install Ansible
      ansible.builtin.pip:
        name: "ansible=={{ lookup('env', 'ANSIBLE_VERSION') }}"
        break_system_packages: true