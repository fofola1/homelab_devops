---
- name: Configure the Proxmox host
  hosts: proxmox_hosts
  become: true
  gather_facts: true

  vars_files:
    - ../config/infra.yaml

  vars:
    zfs_pool_name: tank

  tasks:
    - name: Verify the ZFS pool configuration
      ansible.builtin.assert:
        that:
          - proxmox.zfs.drives | length > 0
          - proxmox.zfs.raid_level | length > 0
        fail_msg: >-
          The ZFS pool must be configured in config/infra.yaml with a list of
          whole disk devices and a RAID level.

    - name: Check ZFS pool status
      ansible.builtin.command: zpool status {{ zfs_pool_name }}
      register: zfs_pool_status
      changed_when: false
      failed_when: false

    - name: Create ZFS pool
      ansible.builtin.command: >-
        zpool create -f {{ zfs_pool_name }} {{ proxmox.zfs.raid_level }} {{ proxmox.zfs.drives | join(' ') }}
      when: zfs_pool_status.rc != 0
      changed_when: true
