all:
  children:
    cloud_storage_hosts:
      hosts:
        cloud_storage_vm:
          ansible_host: "{{ lookup('env', 'CLOUD_STORAGE_HOST_IP') }}"
          ansible_user: "{{ lookup('env', 'CLOUD_STORAGE_DEPLOY_USER') }}"
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: "{{ lookup('env', 'TS_PROXMOX_HOSTNAME') }}"
          ansible_user: root
