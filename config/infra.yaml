# Committed infrastructure configuration for the Proxmox infora.
#
# Values that describe the physical setup (Proxmox node, ZFS pool, Cloud Storage
# VM addressing) live here so they can be committed. GitHub repository variables
# and secrets only keep deployment credentials and workflow-specific values that
# must not be committed.

access:
  # Admin account. Created on the Proxmox host and on every VM, with sudo.
  # Add one or more public keys to the directory below before running setup.
  admin_user: "admin"
  admin_authorized_keys_dir: "config/ssh/admin"
  # Automation account. Created on the Proxmox host without sudo and on the VM
  # with the privileges needed to deploy. One key per target, stored in GitHub.
  deploy_user: "deployer"
  # Proxmox API user (without @pve) for deployment, used by the setup script and
  # the Terraform provider. Put the real value here before running the setup.
  deploy_api_user: "deployer"

proxmox:
  node: "nas"
  zfs:
    # Data pool created by ./prepare-proxmox.sh. The setup wipes these drives.
    # Use "raidz1" (one-drive redundancy), "mirror", or "none" for a single
    # drive without redundancy.
    raid_level: "raidz1"
    drives:
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
    # Example: a single-disk server where Proxmox VE and the data share the
    # same disk. No data pool is created; use an empty list (or remove the
    # drives key) and the setup skips the pool:
    # drives: []

cloud_storage:
  template: "alpine-324"
  # Image user with passwordless doas, used to bootstrap the deployment account.
  bootstrap_user: "alpine"
  id: 120
  datastore: "local-lvm"
  image_datastore: "local"
  network:
    ip: "10.10.10.31"
    cidr: 24
    gateway: "10.10.10.1"
  deploy:
    path: "/opt/docker"
  storage:
    # Mount /tank/immich and /tank/filebrowser from Proxmox over virtiofs.
    # Requires virtiofs devices on the VM and matching shares on the host;
    # leave false to keep those paths on the VM's own disk.
    virtiofs_shares: false
